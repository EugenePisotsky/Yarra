[workspace]
members = [
    "crates/app_editor",
    "crates/app_game",
    "crates/atmosphere",
    "crates/engine",
    "crates/environment",
    "crates/environment_compile",
    "crates/terrain_render",
    "crates/upscaling",
    "crates/vegetation",
    "crates/vegetation_compile",
    "crates/vegetation_render",
    "crates/world",
    "crates/world_cook",
    "crates/world_db",
]
resolver = "3"
exclude = ["third_party/wgpu-hal"]

[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
atmosphere = { package = "yarra-atmosphere", path = "crates/atmosphere" }
bevy = { version = "0.19", default-features = false, features = ["3d", "basis-universal", "ktx2", "png", "ui", "zstd_rust"] }
bevy_egui = "0.41.1"
blake3 = "1"
bincode = { version = "2", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
engine = { package = "yarra-engine", path = "crates/engine" }
environment = { package = "yarra-environment", path = "crates/environment" }
environment-compile = { package = "yarra-environment-compile", path = "crates/environment_compile" }
glam = "0.32"
terrain-render = { package = "yarra-terrain-render", path = "crates/terrain_render" }
upscaling = { package = "yarra-upscaling", path = "crates/upscaling" }
vegetation = { package = "yarra-vegetation", path = "crates/vegetation" }
vegetation-compile = { package = "yarra-vegetation-compile", path = "crates/vegetation_compile" }
vegetation-render = { package = "yarra-vegetation-render", path = "crates/vegetation_render" }
world = { package = "yarra-world", path = "crates/world" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
naga = { version = "29", features = ["wgsl-in"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
world-db = { package = "yarra-world-db", path = "crates/world_db" }
world-cook = { package = "yarra-world-cook", path = "crates/world_cook" }
zstd = "=0.13.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"
