[workspace]
members = [
    "crates/app_editor",
    "crates/app_game",
    "crates/engine",
    "crates/ground_cover",
    "crates/ground_cover_compile",
    "crates/terrain_render",
    "crates/world",
    "crates/world_cook",
    "crates/world_db",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
bevy = { version = "0.19", default-features = false, features = ["3d", "basis-universal", "ktx2", "png", "ui", "zstd_rust"] }
bevy_egui = "0.41.1"
blake3 = "1"
bincode = { version = "2", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
engine = { package = "yarra-engine", path = "crates/engine" }
glam = "0.32"
ground-cover = { package = "yarra-ground-cover", path = "crates/ground_cover" }
ground-cover-compile = { package = "yarra-ground-cover-compile", path = "crates/ground_cover_compile" }
terrain-render = { package = "yarra-terrain-render", path = "crates/terrain_render" }
world = { package = "yarra-world", path = "crates/world" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
naga = { version = "29", features = ["wgsl-in"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
world-db = { package = "yarra-world-db", path = "crates/world_db" }
world-cook = { package = "yarra-world-cook", path = "crates/world_cook" }
zstd = "=0.13.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"
