[workspace]
members = ["crates/app_game", "crates/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["3d", "ui"] }
engine = { package = "yarra-engine", path = "crates/engine" }

# Keep local iteration responsive while compiling Bevy's dependencies with
# optimizations representative of the actual game.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
