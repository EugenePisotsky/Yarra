[workspace]
members = [
    "crates/app_game",
    "crates/engine",
    "crates/world",
    "crates/world_cook",
    "crates/world_db",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
bevy = { version = "0.19", default-features = false, features = ["3d", "png", "ui"] }
blake3 = "1"
bincode = { version = "2", features = ["serde"] }
crossbeam-channel = "0.5"
engine = { package = "yarra-engine", path = "crates/engine" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
world = { package = "yarra-world", path = "crates/world" }
world-db = { package = "yarra-world-db", path = "crates/world_db" }
zstd = "=0.13.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"
