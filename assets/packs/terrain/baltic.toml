# Terrain surfaces of the Baltic coast island: beach and dunes, meadows, pine and mixed
# forest floors, paths, alpine rock/scree/snow and wet ground. Each surface is one layer
# of the texture arrays, in this order. Mask bindings are in reteya-ground-layers.toml.
#
# Sources are Megascans surfaces under ~/Dev/Assets/terrain/sources (licensed, local only).
# `tools/import_terrain_surfaces.py` converts them into assets/local/terrain/baltic/source,
# `tools/compile_terrain_textures.py --pack baltic` builds the runtime arrays and
# `tools/prepare_terrain_bake.py --pack baltic` the cooker's inputs.
#
# Per surface:
# - `tile_size`: metres of one texture repetition (the scan's physical size unless noted).
# - `normal_strength`: 0..1 scale of the tangent normal's slope.
# - `roughness`: the roughness map is remapped to this range.
# - `blend_height`: how strongly the surface's height map wins where surfaces overlap.
#   Stones and needles poke through sand and moss; flat sand or dirt fills the gaps.
# - `anti_tiling`: stochastic albedo for surfaces whose repetition shows.
# - `color_match`: optional source whose mean colour this surface takes, so variants of one
#   material (flat and rippled sand) agree, or a mean sRGB colour.
# - `worn`: what roads and paths wear the surface down to, surface keys with relative weights
#   (at most two); a surface without wears to itself.
# - `trampled`: what light wear (path edges, little-used tracks) tramples it to, a surface key;
#   without, light wear goes straight to `worn`.
pack_key = "baltic"
storage = "local-ignored"
sources = "~/Dev/Assets/terrain/sources"
redistribution_license = "Megascans (Fab Standard License); not redistributable"
texture_size = 1024
macro_variation = "macro_variation.png"

[[surfaces]]
key = "beach-sand"
name = "Beach sand"
source = "beach_sand_uinladeo_8k"
tile_size = 4.0
normal_strength = 0.6
roughness = [0.55, 1.0]
blend_height = 0.15
anti_tiling = false

[[surfaces]]
key = "dune-sand"
name = "Dune sand"
source = "rippled_sand_dune_vd3mbbus_4k"
color_match = "beach_sand_uinladeo_8k"
