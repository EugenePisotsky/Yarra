# Reteya ground-analysis surfaces. Append new entries to keep existing texture-array
# indices stable. Wet surfaces are tuned variants of available dirt/gravel scans, not
# additional photogrammetry captures. The terrain masks choose coverage; these scans
# supply metre-scale detail.

[[surfaces]]
key = "bedrock"
name = "Outcrop rock"
# Grey fractured rock (greywacke-like, no strata, which read as bark when projected flat onto
# gentle ground). A 1 m scan shown at 2.5 m: rock reads the same at either scale.
source = "rough_rock_wall_tinjdj1bw_8k"
tile_size = 2.5
normal_strength = 1.0
roughness = [0.45, 0.95]
blend_height = 1.0
anti_tiling = true

[[surfaces]]
key = "scree"
name = "Debris and scree"
source = "coast_rauk_ground_gravel_rough_wfeqejd_4k"
# Mountain scree reads clearly darker than snow (Canterbury greywacke references).
color_match = [0.52, 0.51, 0.49]
tile_size = 1.0
normal_strength = 0.9
roughness = [0.55, 1.0]
blend_height = 0.9
anti_tiling = true

