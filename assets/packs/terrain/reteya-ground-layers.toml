# Bottom-to-top coverage opacities, not normalized material weights. Each layer applies
# result = result * (1 - mask) + surface_mix * mask. Diagnostic flow, hollows and ridges
# stay in Houdini; only these material masks go to the game. Preview colours are sRGB
# authoring colours, not replacements for the game's scans or lighting.

[[layers]]
mask = "land"
name = "Dry meadow"
surfaces = [["dry-meadow", 1.0]]
