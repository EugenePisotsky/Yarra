[package]
name = "yarra-upscaling"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
metalfx = ["dep:objc2", "dep:objc2-metal", "dep:objc2-metal-fx", "wgpu/metal"]

[dependencies]
bevy.workspace = true
bytemuck.workspace = true
wgpu = { version = "29.0.4", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLCommandBuffer", "objc2-core-foundation"], optional = true }
objc2-metal-fx = { version = "0.3.2", default-features = false, features = ["std", "MTLFXSpatialScaler", "MTLFXTemporalScaler"], optional = true }
