# The frame budget and the views `tools/bench.py` measures it in.
#
# GPU busy milliseconds per frame at the play setup (fullscreen, 50% + MetalFX Temporal,
# 1728×1084 internal) with the Mac's GPU at its Maximum performance state, where runs repeat.
# 1728×1084 is about the 1920×1080 a PS5 renders at 50% of 4K. After minutes of play heat holds
# the GPU at about three quarters of its top clock (tools/power_history.csv), where the same frame
# takes about 1.35× as long. 60 fps needs about 14 ms busy, MetalFX's wait leaving the GPU idle
# about 1.4 ms of each frame, so the budget holds 60 fps in long play: 10.5 ms at Maximum.
#
# A line is a group of passes the trace can tell apart. A change that adds work states its cost
# against its line; a line over budget is optimised, or the excess ships as a quality tier.

total_ms = 10.5
# Frames are counted by the temporal resolve, which every presentation the bench runs has once a
# frame: MetalFX Temporal's pass, or TAA's.
frames_by = ["MetalFX Temporal", "temporal anti-aliasing"]
time = "10:00"
warmup_seconds = 20
profile_seconds = 15
cooldown_seconds = 90
# Passes that work in the gaps of others, charged only the time they run alone: the cloud
# volume's sweep spans whatever it overlaps, and an even split charged it 0.15–1.2 ms by chance.
# Bevy's light clustering count pass rasterises nothing here (no clustered lights; its populate
# twin takes 0.01 ms) but runs beside the grass G-buffer, which an even split charged 0.3 ms of
# to the engine in the meadow.
background = ["cloud volume", "clustering count pass"]

[[line]]
name = "opaque"
ms = 2.5
# The G-buffer pass and forward surfaces: terrain 1.0, trees 1.0, rocks, buildings and
# characters 0.5.
passes = ["^main_opaque_pass_3d", "deferred prepass$"]

[[line]]
name = "deferred lighting"
ms = 0.8
# Every model's kernel: the shared lighting's (terrain 0.5), then grass's (0.3).
passes = ["deferred lighting$"]

[[line]]
name = "prepass and motion"
ms = 0.4
passes = ["prepass$", "scene motion", "geometry motion"]

[[line]]
name = "shadows"
ms = 1.2
passes = ["^shadow_"]

[[line]]
name = "grass"
ms = 1.0
# The blades' G-buffer pass and their compute; their lighting is a deferred lighting kernel.
passes = ["grass", "vegetation"]

[[line]]
name = "sky and air"
# The composite's sea, sky, clouds and glare 0.6–0.8 ms, haze and mist 0.2–0.3, blowing snow
# 0.25–0.3 in the snow views; Bevy's atmosphere tables, light shafts and sun occlusion besides.
ms = 0.8
passes = ["^sky", "^atmosphere", "cloud", "shafts", "sun occlusion"]

[[line]]
name = "upscale and post"
# MetalFX Temporal's own passes take about 2.2 ms; after them one pass tone-maps the 7.5 Mpx
# output onto the window and draws the UI, 0.25 ms of fragment work that the even split charges
# about 0.4. Bloom and eye adaptation run on the rendered image before it, 0.25 ms together. The
# UI camera's passes (`ui`, `_2d`, `upscaling`) and Bevy's own tone map run only under
# --temporal-standard-output, a fixed --frame and TAA, whose sharpening takes 0.06-0.09 ms;
# FXAA only under the Linear and MetalFX Spatial upscalers.
ms = 3.0
passes = ["MetalFX", "^temporal anti-aliasing$", "^upscaling$", "bloom", "eye adaptation",
    "tone map", "^tonemapping$",
    "^ui$", "_2d$", "contrast_adaptive_sharpening", "^fxaa$"]

[[line]]
name = "world compute"
ms = 0.2
passes = ["^tree", "print", "albedo", "horizon"]

[[line]]
name = "particles"
ms = 0.2
passes = ["particles", "rain", "snow"]

[[line]]
name = "engine"
# Bevy's and wgpu's per-frame work: uniforms, mesh preprocessing, light clusters, indirect
# arguments, buffer updates.
ms = 0.4
passes = ["uniform", "bin unpacking", "preprocessing", "indirect", "clustering", "sparse buffer",
    "^bevy_", "^yarra_", "GPU Execution", "timestamp", "GL/CL", "^$"]

